name: Model Data Refresh

# RAP:  runs every hour  → 5 min past the hour (new run available ~35 min after cycle)
# GFS:  runs every 6 hrs → 45 min past 00/06/12/18z (data available ~3.5 hrs after cycle)
# Adjust times if data isn't ready — NOMADS can lag during heavy load periods.

on:
  schedule:
    - cron: '5 * * * *'        # RAP: every hour at :05
    - cron: '45 3,9,15,21 * * *'   # GFS: ~3.75 hrs after 00/06/12/18z
  workflow_dispatch:
    inputs:
      model:
        description: 'Which model to run'
        required: true
        default: 'rap'
        type: choice
        options: [rap, gfs, both]

concurrency:
  group: model-refresh-${{ github.event.inputs.model || 'scheduled' }}
  cancel-in-progress: false    # don't cancel mid-flight model renders

jobs:

  # ---------------------------------------------------------------------------
  rap:
    name: Render RAP model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on every :05 schedule, or manual trigger with model=rap or model=both
    if: >
      github.event_name == 'workflow_dispatch'
        && (github.event.inputs.model == 'rap' || github.event.inputs.model == 'both')
      || github.event_name == 'schedule'
        && contains(github.event.schedule, '5 *')

    steps:
      - uses: actions/checkout@v4

      - name: Install eccodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Render RAP
        run: python scripts/render_models.py --model rap
        env:
          R2_ENDPOINT:   ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Summary
        if: always()
        run: |
          echo "## RAP Refresh $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "Products: Reflectivity, Surface Temp, CAPE (F00–F03)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  gfs:
    name: Render GFS model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on the 3/9/15/21 schedule or manual trigger
    if: >
      github.event_name == 'workflow_dispatch'
        && (github.event.inputs.model == 'gfs' || github.event.inputs.model == 'both')
      || github.event_name == 'schedule'
        && contains(github.event.schedule, '45 3')

    steps:
      - uses: actions/checkout@v4

      - name: Install eccodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Render GFS
        run: python scripts/render_models.py --model gfs
        env:
          R2_ENDPOINT:   ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Summary
        if: always()
        run: |
          echo "## GFS Refresh $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "Products: CAPE, MSLP, 500mb Height (F000–F048)" >> $GITHUB_STEP_SUMMARY
