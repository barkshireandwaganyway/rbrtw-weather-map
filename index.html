<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RBRTW Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div class="brand">RBRTW Weather Map</div>

  <div class="topTools">
    <button onclick="togglePanel('layersPanel')">LAYERS</button>
    <button onclick="togglePanel('dataPanel')">DATA</button>
  </div>

  <div id="layersPanel" class="floatingPanel hidden">
    <div class="panelTitle">Map Layers</div>

    <label><input type="checkbox" onchange="toggleRadar()"> Weather Radar</label>
    <label><input type="checkbox" onchange="loadAlerts()"> Active Alerts</label>
    <label><input type="checkbox"> Rainfall / QPF</label>
    <label><input type="checkbox"> SPC Outlook</label>
    <label><input type="checkbox"> WPC Outlook</label>
    <label><input type="checkbox"> HRRR Future Radar</label>

    <div class="panelTitle small">Map Focus</div>
    <button class="smallBtn" onclick="focusArea()">RBRTW AREA</button>
    <button class="smallBtn" onclick="focusCounty('bexar')">Bexar</button>
    <button class="smallBtn" onclick="focusCounty('medina')">Medina</button>
    <button class="smallBtn" onclick="focusCounty('atascosa')">Atascosa</button>
  </div>

  <div id="dataPanel" class="floatingPanel hidden rightPanel">
    <div class="panelTitle">Weather Data</div>

    <button class="smallBtn" onclick="loadCurrentConditions()">Current Conditions</button>
    <button class="smallBtn" onclick="loadForecast()">Official Forecast</button>
    <button class="smallBtn" onclick="loadHourlyForecast()">Hourly Forecast</button>

    <div id="weatherInfo">
      <p id="status">Select a data option.</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
