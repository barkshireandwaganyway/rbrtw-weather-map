name: Fetch HRRR GRIB2 Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

jobs:
  fetch-hrrr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system GRIB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools libeccodes-dev

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Fetch HRRR GRIB2 data
        run: |
          python backend/fetch_grib.py

      - name: Convert GRIB2 to PNG frames
        run: |
          python backend/process_grib.py

      - name: Commit updated model data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/model/hrrr
          git commit -m "Update HRRR reflectivity frames" || echo "No changes to commit"
          git push
