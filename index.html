<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RBRTW Weather Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1>RBRTW Weather Map</h1>
      <p>South Central Texas Weather Command Center</p>
    </div>
  </header>

  <main>
    <section id="map"></section>

    <aside id="leftPanel" class="map-control">
      <button class="controlHeader" onclick="togglePanel('leftPanel')">Map Layers</button>
      <div class="panelContent">
        <h2>Map Layers</h2>
        <button onclick="toggleRadar()">Radar Overlay</button>
        <button onclick="loadAlerts()">NWS Alerts</button>
        <button>Rainfall / QPF</button>
        <button>SPC Outlook</button>
        <button>WPC Outlook</button>
        <button>HRRR Future Radar</button>

        <h2>Map Focus</h2>
        <button onclick="focusArea()">RBRTW AREA</button>
        <button onclick="focusCounty('bexar')">Bexar County</button>
        <button onclick="focusCounty('medina')">Medina County</button>
        <button onclick="focusCounty('atascosa')">Atascosa County</button>
      </div>
    </aside>

    <aside id="rightPanel" class="map-control collapsed">
      <button class="controlHeader" onclick="togglePanel('rightPanel')">Weather Data</button>
      <div class="panelContent">
        <h2>Weather Data</h2>
        <button onclick="loadCurrentConditions()">Current Conditions</button>
        <button onclick="loadForecast()">Official Forecast</button>
        <button onclick="loadHourlyForecast()">Hourly Forecast</button>

        <div id="weatherInfo">
          <h2>Data Panel</h2>
          <p id="status">Loading RBRTW AREA data...</p>
        </div>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
