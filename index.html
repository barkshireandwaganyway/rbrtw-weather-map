<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RBRTW Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>RBRTW Weather Map</h1>
    <button id="savePhotoBtn" class="save-photo-btn" type="button" onclick="saveMapPhoto()">Save as Photo</button>
  </header>

  <div id="map"></div>

  <section class="control-card layers-card">
    <div class="card-header" onclick="toggleCard('layersBody')">
      <span>LAYERS</span><span>⌃</span>
    </div>

    <div id="layersBody" class="card-body">
      <label><input id="radarCheck" type="checkbox" onchange="toggleRadar()" /><span class="dot green"></span>Radar</label>
      <div class="data-toggle-sub"><label><input id="dataRadarCheck" type="checkbox" />Radar data card click/tap</label></div>
      <label><input id="pastRadarCheck" type="checkbox" onchange="togglePastRadar()" /><span class="dot green"></span>Past Radar Playback</label>
      <div class="data-toggle-sub"><label><input id="dataPastRadarCheck" type="checkbox" />Past radar data card click/tap</label></div>
      <input id="radarOpacity" class="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.7" oninput="setLayerOpacity('radar')" />

      <label><input id="alertsCheck" type="checkbox" onchange="toggleAlerts()" /><span class="dot red"></span>NWS Alerts / Statements</label>
      <div class="data-toggle-sub"><label><input id="dataAlertsCheck" type="checkbox" checked />Alerts data card click/tap</label></div>

      <label><input id="qpfCheck" type="checkbox" onchange="toggleQpf()" /><span class="dot blue"></span>Rainfall / QPF</label>
      <div class="data-toggle-sub"><label><input id="dataQpfCheck" type="checkbox" checked />QPF data card click/tap</label></div>
      <input id="qpfOpacity" class="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.65" oninput="setLayerOpacity('qpf')" />

      <label><input id="spcCheck" type="checkbox" onchange="toggleSpc()" /><span class="dot yellow"></span>SPC Outlook</label>
      <div class="data-toggle-sub"><label><input id="dataSpcCheck" type="checkbox" checked />SPC data card click/tap</label></div>
      <input id="spcOpacity" class="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.35" oninput="setLayerOpacity('spc')" />

      <label><input id="wpcCheck" type="checkbox" onchange="toggleWpc()" /><span class="dot purple"></span>WPC Outlook</label>
      <div class="data-toggle-sub"><label><input id="dataWpcCheck" type="checkbox" checked />WPC data card click/tap</label></div>
      <input id="wpcOpacity" class="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.6" oninput="setLayerOpacity('wpc')" />

      <label><input id="hrrrCheck" type="checkbox" onchange="toggleHrrr()" /><span class="dot cyan"></span>HRRR Future Radar</label>
      <div class="data-toggle-sub"><label><input id="dataHrrrCheck" type="checkbox" />HRRR data card click/tap</label></div>
      <input id="hrrrOpacity" class="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.72" oninput="setLayerOpacity('hrrr')" />

      <label><input id="countyCheck" type="checkbox" onchange="toggleCountyLines()" /><span class="dot white"></span>County Lines</label>
      <div class="data-toggle-sub"><label><input id="dataCountyCheck" type="checkbox" />County data card click/tap</label></div>
      <input id="countyOpacity" class="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.25" oninput="setLayerOpacity('county')" />

      <div class="divider"></div>

      <label><input id="tempCheck" type="checkbox" onchange="toggleTemperatures()" /><span class="dot orange"></span>Temperatures</label>
      <div class="data-toggle-sub"><label><input id="dataTempCheck" type="checkbox" checked />Temperature station data card</label></div>
      <div id="tempSubToggles" class="sub-toggle-box hidden">
        <label><input id="tempModeTempCheck" type="checkbox" checked onchange="setTempMode('temp')" />Temp</label>
        <label><input id="tempModeHeatCheck" type="checkbox" onchange="setTempMode('heat')" />Heat Index</label>
        <label><input id="tempModeWindCheck" type="checkbox" onchange="setTempMode('windchill')" />Wind Chill</label>
      </div>

      <label><input id="windCheck" type="checkbox" onchange="toggleWindLayer()" /><span class="dot cyan"></span>Wind Barbs</label>
      <div class="data-toggle-sub"><label><input id="dataWindCheck" type="checkbox" checked />Wind station data card</label></div>
      <input id="windOpacity" class="opacity-slider" type="range" min="0.05" max="1" step="0.05" value="0.55" oninput="setLayerOpacity('wind')" />

      <label><input id="rain72Check" type="checkbox" onchange="toggleRainfall72()" /><span class="dot blue"></span>Rainfall Totals / QPE</label>
      <div class="data-toggle-sub"><label><input id="dataRainfallCheck" type="checkbox" checked />QPE data card click/tap</label></div>
      <div id="rainfallSubToggles" class="sub-toggle-box hidden">
        <label><input id="rain24Check" type="checkbox" checked onchange="setRainfallPeriod('24')" />Past 24 hr Total</label>
        <label><input id="rain48Check" type="checkbox" onchange="setRainfallPeriod('48')" />Past 48 hr Total</label>
        <label><input id="rain72SubCheck" type="checkbox" onchange="setRainfallPeriod('72')" />Past 72 hr Total</label>
      </div>

      <label><input id="airQualityCheck" type="checkbox" onchange="toggleAirQuality()" /><span class="dot lime"></span>Air Quality</label>
      <div class="data-toggle-sub"><label><input id="dataAirQualityCheck" type="checkbox" checked />Air Quality data card click/tap</label></div>

      <label><input id="surfaceCheck" type="checkbox" onchange="toggleSurfaceMap()" /><span class="dot pink"></span>Surface Map</label>
      <div class="data-toggle-sub"><label><input id="dataSurfaceCheck" type="checkbox" />Surface map data card click/tap</label></div>
      <div id="surfaceSubToggles" class="sub-toggle-box hidden">
        <label><input id="surfaceDay1Check" type="checkbox" checked onchange="setSurfaceDay(1)" />Day 1</label>
        <label><input id="surfaceDay2Check" type="checkbox" onchange="setSurfaceDay(2)" />Day 2</label>
        <label><input id="surfaceDay3Check" type="checkbox" onchange="setSurfaceDay(3)" />Day 3</label>
      </div>

      <div class="divider"></div>
      <button onclick="refreshActiveLayers()">Refresh Active Layers</button>
      <div class="scroll-hint">Scroll</div>

      <div class="divider"></div>
      <div class="photo-options-box">
        <div class="photo-options-title">PHOTO OPTIONS</div>
        <label><input id="photoIncludeKeyCheck" type="checkbox" checked />Include map key in PNG</label>
        <label><input id="photoIncludeDataCheck" type="checkbox" />Include data card in PNG</label>
        <small>PNG keys are limited to Radar, QPF, Rainfall QPE, Temperature, Air Quality, SPC, WPC, and Surface Map.</small>
      </div>
    </div>
  </section>

  <section class="control-card data-card">
    <div class="card-header" onclick="toggleCard('dataBody')">
      <span>DATA</span><span>⌃</span>
    </div>
    <div id="dataBody" class="card-body">
      <div class="tab-row">
        <button onclick="loadCurrentConditions()">Current</button>
        <button onclick="loadForecast()">Forecast</button>
        <button onclick="loadHourlyForecast()">Hourly</button>
      </div>
      <div id="weatherInfo">
        <p id="status">Loading RBRTW AREA data...</p>
      </div>
    </div>
  </section>

  <section id="radarTimeline" class="control-card radar-timeline hidden">
    <div class="radar-top-row">
      <strong>Radar Playback</strong>
      <span id="radarFrameLabel">Latest</span>
    </div>
    <input id="radarFrameSlider" type="range" min="0" max="0" step="1" value="0" oninput="setRadarFrameFromSlider()" />
    <div class="radar-controls">
      <button onclick="previousRadarFrame()">◀</button>
      <button onclick="toggleRadarAnimation()" id="radarPlayBtn">Play</button>
      <button onclick="nextRadarFrame()">▶</button>
      <span id="radarLoopText">Timeline ready</span>
    </div>
  </section>

  <section id="hrrrTimeline" class="control-card hrrr-timeline hidden">
    <div class="hrrr-top-row">
      <strong>HRRR Future Radar</strong>
      <span id="hrrrFrameLabel">F01</span>
    </div>
    <input id="hrrrFrameSlider" type="range" min="0" max="0" step="1" value="0" oninput="setHrrrFrameFromSlider()" />
    <div class="hrrr-controls">
      <button onclick="previousHrrrFrame()">◀</button>
      <button onclick="toggleHrrrAnimation()" id="hrrrPlayBtn">Play</button>
      <button onclick="nextHrrrFrame()">▶</button>
      <span id="hrrrLoopText">Loop ready</span>
    </div>
  </section>

  <section class="control-card legend-card">
    <div class="card-header" onclick="toggleCard('legendBody')">
      <span>LEGEND</span><span>⌃</span>
    </div>
    <div id="legendBody" class="card-body">
      <div id="legendContent">Turn on a layer to view its legend.</div>
    </div>
  </section>

  <button class="home-btn" onclick="focusArea()" title="Home">⌂</button>
  <button class="basemap-btn" onclick="toggleBasemapMenu()" title="Basemap / Map style">▦</button>
  <div id="basemapMenu" class="basemap-menu hidden">
    <button onclick="setBasemap('standard')">Standard</button>
    <button onclick="setBasemap('dark')">Dark</button>
    <button onclick="setBasemap('satellite')">Satellite</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
