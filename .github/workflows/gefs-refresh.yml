name: GEFS Ensemble Refresh

# GEFS cycles at 00/06/12/18Z. Running ~4 hours after each cycle gives the
# 21-member ensemble + mean/spread products time to be fully published.

on:
  schedule:
    - cron: '30 3,9,15,21 * * *'   # ~3.5 hrs after 00/06/12/18z
  workflow_dispatch:

concurrency:
  group: gefs-refresh
  cancel-in-progress: false

jobs:
  render:
    name: Render GEFS ensemble products
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install eccodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Render GEFS ensemble mean + spread
        run: python scripts/render_ensembles.py
        env:
          R2_ENDPOINT:   ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Summary
        if: always()
        run: |
          echo "## GEFS Ensemble Refresh $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "Products: Mean CAPE, Mean MSLP, Spread 500mb Height (F000–F072)" >> $GITHUB_STEP_SUMMARY
